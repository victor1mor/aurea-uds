packages:
  - packages/*
  - apps/*
  # FORA do workspace de proposito, e nao por acidente: o `apps/native-smoke` e' um app Expo
  # DESCARTAVEL, que existe so' para provar o Lote 0 num Android (NATIVE.md §7). Dentro do
  # workspace, todo `pnpm install` desta casa passaria a baixar o Expo inteiro — centenas de MB e
  # uma arvore de dependencia nova — para uma coisa que se usa uma vez por lote.
  #
  # Ele tambem NAO consome os pacotes por link: instala os TARBALLS que `node preparar.mjs` gera.
  # A razao esta' escrita la', e a curta e' esta: link de workspace exigiria configurar
  # `watchFolders` no Metro, e uma falha de configuracao do bundler nao ensina nada sobre a
  # fundacao nativa — que e' a unica coisa que aquele app existe para medir.
  - '!apps/native-smoke'

overrides:
  # CVE GHSA-4cwx-7wf7-3272 (alto): undici >=7.0.0 <7.29.0 vaza informacao entre
  # usuarios e trava no parse. Chega por jsdom, que e' dependencia de TESTE — nao
  # sai em pacote publicado. Mas o gate de auditoria da CI bloqueia em `high`, e
  # esta' certo: divida de seguranca conhecida nao dorme no repositorio.
  # 7.29.0 e' o patch e cabe no `^7.25.0` que o jsdom pede — sem bump maior.
  # Sai quando o jsdom subir sozinho para a linha 8.x.
  # 30/09/2026: mais dois `high` na mesma linha (GHSA-rfgv-xxqx-mfg5 e GHSA-w293-vg96-wgc3),
  # corrigidos na 7.29.1. Continua cabendo no `^7.25.0` do jsdom.
  # 25/10/2026: GHSA-xjj6-f33q-929c (alto, publicado em 23/10 depois da CI do pedido #95; o `main`
  # reprovou na junção), negacao de servico com muitos `content-encoding`. Corrigido na 7.30.1, que
  # cabe no `^7.25.0` do jsdom 29.1.1 (medido com `npm view`).
  undici: '^7.30.1'
  # GHSA-2v37-7h3g-55p8 (alto): nanoid <3.3.17 entra em laco infinito quando um
  # gerador customizado recebe size zero. NAO veio do @xyflow/react — medido com
  # `pnpm why nanoid` em 09/08/2026: os dois caminhos sao postcss, um por vite
  # (teste e proof-client) e outro por next (proof-server). E' divida pre-existente
  # que apareceu quando a auditoria voltou a rodar, e o gate da CI reprova em `high`.
  # 3.3.17 e' o patch e cabe no intervalo que o postcss pede — sem bump maior.
  nanoid: '^3.3.17'
  # 31/10/2026: cinco `high` novos no node-forge <=1.4.0 (GHSA-7wch-p9px-956x, GHSA-jc66-7q78-782g,
  # GHSA-8hrf-8g6f-7xwp, GHSA-hqq3-7jhf-c5jx, GHSA-5x38-2vff-x55p), achados pela CI do pedido #109.
  # Corrigidos na 1.4.1; a ultima publicada e' a 1.4.2 (medido com `npm view`), e ela cabe no `^1.3.3`
  # que o @expo/code-signing-certificates pede. So' devDependencies do @aurea-uds/native (> expo >
  # @expo/cli); nenhum tarball a contem. Com isto sai o aceite de 01/10/2026 (GHSA-86w9-cpqp-85rv, a
  # faixa dele e' <=1.4.0), como o registro dele previa.
  node-forge: '^1.4.2'
  # GHSA-6j4f-fj2g-mc7p e GHSA-qhr7-859c-m2p7 (altos, 30/09/2026): brace-expansion >=4.0.0
  # <5.0.11. Chega por UM caminho, de ferramenta — @aurea-uds/native (devDependencies) >
  # @react-native-community/datetimepicker > expo > @expo/cli > ... > minimatch 10 > brace-expansion.
  # Nao sai em pacote publicado. 5.0.11 e' o patch e cabe no `^5.0.8` que o minimatch 10.2.6 pede — sem
  # bump maior. O seletor pega SO essa linha: as linhas 1.x e 2.x, de outros minimatch, ficam.
  'brace-expansion@>=4.0.0 <5.0.11': '^5.0.11'
  # QUATRO ALERTAS NOVOS em 06/10/2026, que reprovaram a CI do pedido #43 sem nenhuma dependencia
  # nossa mudar (o `main` reprova junto). Todos de FERRAMENTA, nenhum em pacote publicado, e todos
  # com correcao publicada — por isso override, e nao aceite com registro. Cada seletor pega SO a
  # faixa vulneravel, e cada versao corrigida cabe na faixa que quem usa pede (medido com
  # `npm view` em 06/10/2026), sem bump maior:
  #   • GHSA-pqg4-j6r4-53mv (critico): shell-quote >=1.8.4 <1.11.0, injecao de comando no
  #     `quote()`. Chega por react-devtools-core 6.1.5 (pede ^1.6.1), sob o react-native e o Expo
  #     das devDependencies do @aurea-uds/native.
  #   • GHSA-68fv-2mgg-jv7q (alto): source-map-js >=1.0.0 <1.2.2, negacao de servico. Chega pelo
  #     postcss 8.5.23 (pede ^1.2.1), sob vite, vitest e o next do proof-server.
  #   • GHSA-vc2v-76pw-4v95 (alto): compression <1.8.2, vazamento de memoria. Chega pelo @expo/cli
  #     (pede ^1.7.4), sob as devDependencies do @aurea-uds/native.
  #   • GHSA-wq5f-xc86-pv6w (alto): sharp <0.35.5, a libvips/librsvg de dentro (CVE-2026-96889).
  #     Chega pelo next 16.3.6 do proof-server (pede ^0.35.4).
  # Saem quando os pacotes de cima passarem a pedir a versao corrigida sozinhos.
  'shell-quote@>=1.8.4 <1.11.0': '^1.11.0'
  'source-map-js@>=1.0.0 <1.2.2': '^1.2.2'
  'compression@<1.8.2': '^1.8.2'
  'sharp@<0.35.5': '^0.35.5'
  # 21/10/2026 (moderado): uuid <11.1.1, sem o limite do buffer em v3/v5/v6 quando se passa `buf`. Chega pelo
  # xcode 3.0.1, sob o @expo/config-plugins das devDependencies do @aurea-uds/native (pede o 7.0.3). O xcode so' chama
  # `require('uuid').v4()`, e a entrada CommonJS do 11 tem o mesmo `v4` — lido no codigo dos dois.
  'uuid@<11.1.1': '^11.1.1'
  # 25/10/2026: GHSA-mrhx-c7xc-m3w5 (alto, revisado em 23/10 e reprovou o `main` na junção do pedido #95): zod
  # <4.6.6 esgota a memoria validando lista grande sem limite. Chega por UM caminho, de ferramenta — @aurea-uds/native
  # (devDependencies) > expo-document-picker > expo > @expo/cli, que pede `^3.25.76`; a linha 3 nao tem correcao (a
  # ultima e' a 3.25.76) e o @expo/cli mais novo (58.1.15) pede o mesmo. Por isso o salto para a 4, como o uuid acima:
  # o @expo/cli so' usa `z.object/string/enum/array/union/literal/optional/number/boolean`, `.min`, `.describe`,
  # `.strict`, `.safeParse` e `error.message` (lido em `DevToolsPlugin.schema.js`, `createMCPDevToolsExtensionSchema.js` e
  # `DevToolsPlugin.js`), e a entrada CommonJS da 4 tem todos. E aqui ele nem roda: so' serve aos tipos, e o
  # `apps/native-smoke`, que roda o Expo, fica fora do workspace. Sai quando o @expo/cli pedir a 4.6.6 sozinho.
  'zod@<4.6.6': '^4.6.6'
  # 06/11/2026, a auditoria externa (A-003): dois moderados, os dois de FERRAMENTA e por UM caminho — @aurea-uds/native
  # (devDependencies) > @react-native-community/datetimepicker > expo > @expo/* (cli, config, config-plugins, fingerprint,
  # metro-config) — nenhum tarball os contem (`pnpm audit --prod` da zero):
  #   • GHSA-3g3m-2fjr-6pw4: glob >=9.0.0 <=14.0.1, o AbortSignal nao para a busca depois do prazo. Corrigido na 14.0.2;
  #   • GHSA-g3hv-75wg-m249: minimatch >=7.0.0 <11.0.1, negacao de servico por padrao que se multiplica. Corrigido na 11.0.1.
  # Os dois sao salto de versao maior (o Expo pede glob 13 e minimatch 10). Lido no codigo do Expo em 06/11/2026: o
  # @expo/* chama do glob so' `glob`, `globSync`, `sync` e `globStream`, e do minimatch so' a classe `Minimatch` com
  # `.pattern`, `.negate` e `.match` — tudo continua na 14 e na 11 (lido nas declaracoes publicadas delas). O que a 14 e
  # a 11 tiraram (`makeRe`, `Minimatch#regexp`, `walk()` devolvendo Set) ninguem daqui usa. Saem quando o Expo pedir as
  # versoes corrigidas sozinho.
  'glob@>=9.0.0 <14.0.2': '^14.0.2'
  'minimatch@>=7.0.0 <11.0.1': '^11.0.1'

